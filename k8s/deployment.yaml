apiVersion: apps/v1
kind: Deployment
metadata:
  name: phishing-shield-deployment
  labels:
    app: phishing-shield
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phishing-shield
  template:
    metadata:
      labels:
        app: phishing-shield
    spec:
      containers:
      - name: phishing-shield-container
        image: <YOUR_DOCKERHUB_OR_REGISTRY_USER>/phishing-shield:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: PORT
          value: "5000"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 45
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: phishing-shield-service
  labels:
    app: phishing-shield
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: phishing-shield

