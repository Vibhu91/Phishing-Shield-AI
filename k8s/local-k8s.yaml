apiVersion: apps/v1
kind: Deployment
metadata:
  name: phishing-shield-deployment
  labels:
    app: phishing-shield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phishing-shield
  template:
    metadata:
      labels:
        app: phishing-shield
    spec:
      containers:
      - name: phishing-shield-container
        image: phishing-shield:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: PORT
          value: "5000"
        - name: HOST
          value: "0.0.0.0"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: KERAS_BACKEND
          value: "torch"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "3Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 45
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: phishing-shield-service
  labels:
    app: phishing-shield
spec:
  type: LoadBalancer
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: phishing-shield
