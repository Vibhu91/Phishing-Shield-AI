services:
  - type: web
    name: phishing-shield-ai
    env: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "5000"
      - key: HOST
        value: "0.0.0.0"
      - key: KERAS_BACKEND
        value: "torch"
